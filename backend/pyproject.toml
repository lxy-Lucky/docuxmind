[project]
name = "docuxmind-backend"
version = "0.1.0"
description = "DocuMind backend — local knowledge base with agent-driven navigation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "openai>=1.50",
  "openpyxl>=3.1",
  "pypdf>=4.3",
  "python-docx>=1.1",
  "markdown-it-py>=3.0",
  "pandas>=2.2",
  "jieba>=0.42",
  "sudachipy>=0.6",
  "sudachidict-core>=20240409",
  "langdetect>=1.0.9",
  "structlog>=24.4",
  "aiofiles>=24.1",
  "python-magic-bin>=0.4.14; sys_platform == 'win32'",
  "python-magic>=0.4.27; sys_platform != 'win32'",
  "python-multipart>=0.0.12",
]

[tool.uv]
dev-dependencies = [
  "pytest>=8.3",
  "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
